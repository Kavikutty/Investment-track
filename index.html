<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Invest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Investment Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#000;--s1:#121214;--s2:#1c1c20;--line:#2a2a30;--tx:#f2f2f4;--mu:#8e8e98;--inv:#5eead4;--lend:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:0 auto;padding:20px 16px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:15px;font-weight:600;color:var(--mu);margin-bottom:14px}
h2{font-size:17px;font-weight:600;margin:24px 0 10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;padding:10px;border-radius:12px}
nav button[aria-selected=true]{color:var(--tx);background:var(--s2)}
button{cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--inv);outline-offset:2px}
.btn{background:var(--tx);color:#000;border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.btn.g{background:var(--s2);color:var(--tx)}
.btn.d{background:none;color:var(--bad)}
.donut{display:block;margin:0 auto 14px;width:220px;height:220px}
.legend{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--s2);color:var(--mu);margin-right:6px}
.bar{height:6px;border-radius:3px;background:var(--s2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--inv)}
.acts{display:flex;gap:4px;margin-top:6px}
.acts button{background:none;border:0;color:var(--mu);font-size:13px;padding:2px 8px 2px 0}
select,select option,select optgroup{background-color:#000;color:#f2f2f4}
select{color-scheme:dark}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(92vw,440px);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.75)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:10px}
.seg button.on{background:var(--tx);color:#000;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;color:var(--tx)}
.chk input{width:auto}
.res{display:grid;gap:10px;margin-top:16px}
.res div{display:flex;justify-content:space-between;gap:10px}
.ok{color:var(--inv)}.no{color:var(--bad)}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}
.empty .btn{margin-top:14px}
</style>
</head>
<body>
<main id="app"></main>
<nav role="tablist">
  <button role="tab" data-t="ov">Overview</button>
  <button role="tab" data-t="pl">Plans</button>
</nav>

<dialog id="dlg"><form id="f" method="dialog"></form></dialog>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let plans=store.get('mt_plans',[]), cfg=store.get('mt_cfg',{url:'',key:''});
let tab='ov';
const BASE=['FD','PPF','Mutual Fund','Stocks'];let myTypes=store.get('mt_types',[]);const allTypes=()=>[...BASE,...myTypes.filter(t=>!BASE.includes(t))];
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>store.set('mt_plans',plans);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function months(a,b){const d1=new Date(a),d2=new Date(b);return Math.max(0,(d2.getFullYear()-d1.getFullYear())*12+d2.getMonth()-d1.getMonth()+1)}
function amountOf(p){
  if(p.sip){const today=new Date().toISOString().slice(0,10);const end=p.end&&p.end<today?p.end:today;return p.start?p.sip*months(p.start,end):0}
  return +p.amount||0;
}
const isLent=p=>p.kind==='lend';
function totals(){let inv=0,len=0;const by={};plans.forEach(p=>{const a=amountOf(p);isLent(p)?len+=a:inv+=a;const k=isLent(p)?'Lent':p.type;by[k]=(by[k]||0)+a});return{inv,len,by}}

function overview(){
  const t=totals(),sum=t.inv+t.len;
  if(!plans.length)return`<h1>Overview</h1><div class="card empty">Nothing tracked yet.<br>Add your first investment or loan to see where your money sits.<br><button class="btn" onclick="go('pl');edit()">Add a plan</button></div>`;
  const R=84,C=2*Math.PI*R,pi=sum?t.inv/sum*C:0,pl=sum?t.len/sum*C:0;
  const donut=`<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="Invested ${inr(t.inv)}, lent ${inr(t.len)}"><g transform="rotate(-90 110 110)" fill="none" stroke-width="28"><circle cx="110" cy="110" r="${R}" stroke="#1c1c20"/><circle cx="110" cy="110" r="${R}" stroke="var(--inv)" stroke-dasharray="${pi} ${C}"/><circle cx="110" cy="110" r="${R}" stroke="var(--lend)" stroke-dasharray="${pl} ${C}" stroke-dashoffset="${-pi}"/></g><text x="110" y="106" text-anchor="middle" fill="#8e8e98" font-size="13">Total</text><text x="110" y="130" text-anchor="middle" fill="#f2f2f4" font-size="20" font-weight="700">${inr(sum)}</text></svg>`;
  const pct=v=>sum?Math.round(v/sum*100):0;
  const rows=Object.entries(t.by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div style="flex:1"><div class="row sp"><span>${esc(k)}</span><b>${inr(v)}</b></div><div class="bar"><i style="width:${pct(v)}%;background:${k==='Lent'?'var(--lend)':'var(--inv)'}"></i></div></div></div>`).join('');
  return`<h1>Overview</h1><div class="card">${donut}<div class="legend"><div class="row"><span class="dot" style="background:var(--inv)"></span><div><div class="mu">Invested ${pct(t.inv)}%</div><b>${inr(t.inv)}</b></div></div><div class="row"><span class="dot" style="background:var(--lend)"></span><div><div class="mu">Lent to others ${pct(t.len)}%</div><b>${inr(t.len)}</b></div></div></div></div><h2>Where it sits</h2><div class="card" style="padding:4px 16px">${rows}</div>`;
}

function planList(){
  const head=`<div class="row sp" style="margin-bottom:14px"><h1 style="margin:0">Plans</h1><div class="row" style="gap:8px"><button class="btn g" onclick="exportXlsx()">Excel</button><button class="btn g" onclick="settings()">Sync</button><button class="btn" onclick="edit()">Add</button></div></div>`;
  if(!plans.length)return head+`<div class="card empty">No plans yet.<br>Add an FD, PPF, mutual fund, stock, or a loan you gave someone.</div>`;
  const items=[...plans].sort((a,b)=>(b.start||'').localeCompare(a.start||'')).map(p=>{
    const sub=[p.rate?p.rate+'%':'',p.start?fmt(p.start):'',p.end?'to '+fmt(p.end):''].filter(Boolean).join('  ');
    return`<div class="item"><div><div><span class="tag" style="${isLent(p)?'color:var(--lend)':'color:var(--inv)'}">${esc(isLent(p)?'Lent':p.type)}</span>${esc(p.name)}</div><div class="mu">${esc(sub)}${p.sip?' '+inr(p.sip)+'/month SIP':''}</div><div class="acts"><button onclick="edit('${p.id}')">Edit</button><button onclick="del('${p.id}')">Remove</button></div></div><b>${inr(amountOf(p))}</b></div>`}).join('');
  return head+`<div class="card" style="padding:4px 16px">${items}</div>`;
}
const fmt=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

function render(){$('#app').innerHTML={ov:overview,pl:planList}[tab]();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab))}
function go(t){tab=t;render();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

function edit(id){
  const p=plans.find(x=>x.id===id)||{id:uid(),kind:'invest',type:'FD',name:'',amount:'',rate:'',start:new Date().toISOString().slice(0,10),end:'',sip:0};
  const isNew=!plans.some(x=>x.id===p.id);
  const known=allTypes().includes(p.type);
  $('#f').innerHTML=`<h2 style="margin-top:0">${isNew?'Add a plan':'Edit plan'}</h2>
  <div class="seg" id="kind"><button type="button" data-k="invest">I invested</button><button type="button" data-k="lend">I lent</button></div>
  <div id="typeWrap"><label for="type">Type</label><select id="type">${allTypes().map(t=>`<option ${p.type===t?'selected':''}>${esc(t)}</option>`).join('')}<option value="__o" ${!known&&!isLent(p)?'selected':''}>+ Add my own type</option></select><input id="other" placeholder="Name your plan type, e.g. Gold, Chit fund" value="${known?'':esc(p.type)}" style="margin-top:8px;display:none"></div>
  <label for="name" id="nameL">Name</label><input id="name" value="${esc(p.name)}" placeholder="HDFC FD, Nifty 50 fund, Ravi">
  <div class="chk" id="sipWrap"><input type="checkbox" id="sip" ${p.sip?'checked':''}><label for="sip" style="margin:0;color:var(--tx);font-size:15px">Pay by monthly SIP</label></div>
  <label for="amount" id="amtL">Amount (₹)</label><input id="amount" type="number" inputmode="decimal" value="${p.sip||p.amount||''}">
  <label for="rate">Interest or expected return % a year (optional)</label><input id="rate" type="number" step="0.01" value="${p.rate||''}">
  <div class="two"><div><label for="start">Start date</label><input id="start" type="date" value="${p.start||''}"></div><div><label for="end">End date</label><input id="end" type="date" value="${p.end||''}"></div></div>
  <div class="row sp" style="margin-top:20px"><button type="button" class="btn g" onclick="$('#dlg').close()">Cancel</button><button type="button" class="btn" id="saveP">Save plan</button></div>`;
  let kind=p.kind;
  const sync=()=>{document.querySelectorAll('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.k===kind));
    $('#typeWrap').style.display=kind==='lend'?'none':'block';
    $('#nameL').textContent=kind==='lend'?'Lent to':'Name';
    const mf=kind==='invest'&&$('#type').value==='Mutual Fund';
    $('#sipWrap').style.display=mf?'flex':'none';
    $('#amtL').textContent=mf&&$('#sip').checked?'Monthly SIP amount (₹)':kind==='lend'?'Amount lent (₹)':'Amount invested (₹)';
    $('#other').style.display=$('#type').value==='__o'?'block':'none'};
  document.querySelectorAll('#kind button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;sync()});
  $('#type').onchange=sync;$('#sip').onchange=sync;sync();
  $('#saveP').onclick=()=>{
    const name=$('#name').value.trim(),amt=+$('#amount').value;
    if(!name||!(amt>0)){$('#name').style.borderColor=name?'':'var(--bad)';$('#amount').style.borderColor=amt>0?'':'var(--bad)';return}
    let type=kind==='lend'?'Lending':$('#type').value==='__o'?($('#other').value.trim()||'Other'):$('#type').value;
    if(kind==='invest'&&!allTypes().includes(type)){myTypes.push(type);store.set('mt_types',myTypes)}
    const sip=kind==='invest'&&type==='Mutual Fund'&&$('#sip').checked;
    const np={id:p.id,kind,type,name,amount:sip?0:amt,sip:sip?amt:0,rate:$('#rate').value,start:$('#start').value,end:$('#end').value};
    const i=plans.findIndex(x=>x.id===p.id);i<0?plans.push(np):plans[i]=np;save();$('#dlg').close();render();push(np)};
  $('#dlg').showModal();
}
function del(id){const p=plans.find(x=>x.id===id);if(!p||!confirm('Remove "'+p.name+'"?'))return;plans=plans.filter(x=>x.id!==id);save();render();remove(id)}

/* Excel */
function exportXlsx(){
  if(!plans.length){alert('Add a plan first.');return}
  const rows=plans.map(p=>({Kind:isLent(p)?'Lent':'Invested',Type:p.type,Name:p.name,'Amount so far (₹)':Math.round(amountOf(p)),'Monthly SIP (₹)':p.sip||'','Rate %':p.rate||'','Start':p.start||'','End':p.end||''}));
  const t=totals();
  if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Plans');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{Item:'Invested',Amount:Math.round(t.inv)},{Item:'Lent',Amount:Math.round(t.len)},{Item:'Total',Amount:Math.round(t.inv+t.len)}]),'Summary');XLSX.writeFile(wb,'money-tracker.xlsx');return}
  const h=Object.keys(rows[0]);const csv=[h,...rows.map(r=>h.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"'))].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='money-tracker.csv';a.click();
}

/* Supabase sync: table "plans" with columns id text primary key, data jsonb */
const sbOn=()=>cfg.url&&cfg.key;
const sb=(path,o={})=>fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/'+path,{...o,headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',...(o.headers||{})}});
async function push(p){if(!sbOn())return;try{await sb('plans?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{id:p.id,data:p}])})}catch(e){}}
async function remove(id){if(!sbOn())return;try{await sb('plans?id=eq.'+id,{method:'DELETE'})}catch(e){}}
async function checkSetup(){
  const m=$('#smsg');cfg={url:$('#su').value.trim(),key:$('#sk').value.trim()};store.set('mt_cfg',cfg);
  if(!sbOn()){m.textContent='Enter the project URL and anon key first.';m.className='no';return}
  m.className='mu';m.textContent='Checking...';
  const out=[];let bad=false;
  const q=async(col)=>{try{const r=await sb('plans?select='+col+'&limit=1');let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,j}}catch(e){return{ok:false,status:0,j:{message:'Could not reach Supabase. Check the project URL and your internet.'}}}};
  const t=await q('id');
  if(!t.ok){
    bad=true;
    if(t.status===0)out.push(t.j.message);
    else if(t.status===401||t.status===403)out.push('The key was rejected or has no access. Check the anon key and the row-level security policy.');
    else if(t.j.code==='PGRST205'||t.status===404)out.push('Table "plans" was not found.');
    else if(t.j.code==='42703')out.push('Column "id" is missing in table "plans".');
    else out.push('Problem: '+(t.j.message||'status '+t.status));
  }else{
    out.push('Table "plans" found. Column "id" found.');
    const d=await q('data');
    if(d.ok)out.push('Column "data" found.');else{bad=true;out.push(d.j.code==='42703'?'Column "data" is missing.':'Problem with "data": '+(d.j.message||d.status))}
    if(!bad){
      const id='__check__'+Date.now();
      const w=await sb('plans',{method:'POST',body:JSON.stringify([{id,data:{check:true}}])}).catch(()=>null);
      if(w&&w.ok){await sb('plans?id=eq.'+id,{method:'DELETE'}).catch(()=>{});out.push('Writing and deleting works.')}
      else{bad=true;out.push('Reading works, but writing was blocked. Add an insert, update and delete policy for the table.')}
    }
  }
  m.className=bad?'no':'ok';m.innerHTML=out.map(esc).join('<br>');
}
async function syncAll(){
  const m=$('#smsg');m.textContent='Syncing...';
  try{
    const r=await sb('plans?select=id,data');if(!r.ok)throw new Error('Supabase said '+r.status+'. Check the URL, key and that the plans table exists.');
    const remote=await r.json();remote.forEach(x=>{if(!plans.some(p=>p.id===x.id))plans.push(x.data)});
    save();
    const w=await sb('plans?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify(plans.map(p=>({id:p.id,data:p})))});
    if(!w.ok)throw new Error('Could not upload. Check table permissions.');
    m.textContent='Synced '+plans.length+' plans.';m.className='ok';render();
  }catch(e){m.textContent=e.message;m.className='no'}
}
function settings(){
  $('#f').innerHTML=`<h2 style="margin-top:0">Supabase sync</h2><p class="mu">Keeps your plans backed up and the same on every device. Your data still works offline without it.</p>
  <label for="su">Project URL</label><input id="su" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co"><label for="sk">Anon public key</label><input id="sk" value="${esc(cfg.key)}">
  <p id="smsg" class="mu" style="margin-top:12px"></p>
  <div class="row sp" style="margin-top:16px"><button type="button" class="btn g" onclick="$('#dlg').close()">Close</button><button type="button" class="btn g" id="st">Test setup</button><button type="button" class="btn" id="ss">Save and sync</button></div>`;
  $('#st').onclick=checkSetup;
  $('#ss').onclick=()=>{cfg={url:$('#su').value.trim(),key:$('#sk').value.trim()};store.set('mt_cfg',cfg);if(sbOn())syncAll();else{$('#smsg').textContent='Sync turned off.'}};
  $('#dlg').showModal();
}
render();
</script>
</body>
</html>
